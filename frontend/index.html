<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhotoBAse</title>
  </head>
  <body>
    <div id="app"></div>

    <!--
      Если интерфейс не собрался (битая копия скрипта в кеше браузера, обрыв
      загрузки), страница оставалась пустой и выглядела как «нет фото».
      Этот сторож через несколько секунд показывает подсказку вместо пустоты.
    -->
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var host = document.getElementById('app')

          if (host && host.childElementCount === 0) {
            host.innerHTML =
              '<div style="font:15px/1.5 system-ui,sans-serif;max-width:640px;' +
              'margin:80px auto;padding:24px;border:1px solid #e5e7eb;' +
              'border-radius:12px;color:#374151">' +
              '<div style="font-size:18px;font-weight:600;margin-bottom:8px">' +
              'Интерфейс не загрузился</div>' +
              'Похоже, скрипт не запустился — обычно это старая или битая копия ' +
              'в кеше браузера.<br>' +
              '<b>Нажмите Ctrl+Shift+R</b> (жёсткое обновление). Если не помогло — ' +
              'откройте консоль (F12) и посмотрите красную строку: с ней напишите ' +
              'администратору.' +
              '</div>'
          }
        }, 4000)
      })
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
